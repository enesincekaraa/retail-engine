spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/retail_db
    username: postgres
    password: password

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
        ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

logging:
  level:
    org.springframework.cache: trace