services:
  postgres:
    image: postgres:16
    container_name: retail-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: retail_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: retail-redis
    ports:
        - "6379:6379"


volumes:
    postgres-data: